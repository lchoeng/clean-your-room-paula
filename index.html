// ================= CORE =================
const TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('c'),X=cv.getContext('2d');
let DPR=1,SC=1,VW=800,VH=450,GY=355;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);const w=window.innerWidth,h=window.innerHeight;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';SC=Math.min(h/450,w/720);VW=w/SC;VH=h/SC;GY=Math.min(VH-95,VH/2+150);}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function hash(i,s){let x=Math.sin(i*127.1+(s||0)*311.7)*43758.5453;return x-Math.floor(x);}
const FONT='"Arial Rounded MT Bold","Trebuchet MS","Avenir Next",system-ui,sans-serif';
const OL='#2b2340';
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const IMGS={};for(const k in IMG_SRC){const i=new Image();i.src=IMG_SRC[k];IMGS[k]=i;}
const HY=()=>Math.max(0,GY-355);

// ================= STORAGE =================
const store={get(k,d){try{const v=localStorage.getItem('cyrf_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('cyrf_'+k,JSON.stringify(v));}catch(e){}}};
const settings=Object.assign({music:6,sfx:8,musicOn:true,sfxOn:true,voice:true},store.get('settings',{}));
let bests=store.get('bests',{});
function saveSettings(){store.set('settings',settings);applyVol();}

// ================= DRAW HELPERS =================
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function fs(f,lw){if(f){X.fillStyle=f;X.fill();}if(lw!==0){X.lineWidth=lw||2.5;X.strokeStyle=OL;X.lineJoin='round';X.stroke();}}
function circ(x,y,r){X.beginPath();X.arc(x,y,Math.max(.1,r),0,TAU);}
function ell(x,y,rx,ry,rot){X.beginPath();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);}
function line(pts,w,col,outline){X.lineCap='round';X.lineJoin='round';const p=()=>{X.beginPath();X.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)X.lineTo(pts[i][0],pts[i][1]);};if(outline){p();X.strokeStyle=OL;X.lineWidth=w+4;X.stroke();}p();X.strokeStyle=col;X.lineWidth=w;X.stroke();}
function txt(s,x,y,size,fill,o){o=o||{};X.font=`${o.weight||'900'} ${size}px ${FONT}`;X.textAlign=o.align||'center';X.textBaseline=o.base||'middle';if(o.stroke!==false){X.lineJoin='round';X.lineWidth=o.lw||Math.max(3,size*.18);X.strokeStyle=o.stroke||OL;X.strokeText(s,x,y);}X.fillStyle=fill;X.fillText(s,x,y);}
function star(x,y,r1,r2,n,rot){X.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=(rot||0)+i*PI/n;X.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}X.closePath();}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,Math.round((n>>16)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return `rgb(${r},${g},${b})`;}
function heart(x,y,s,col){X.beginPath();X.moveTo(x,y+s*.3);X.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.32);X.bezierCurveTo(x-s*.5,y+s*.62,x-s*.1,y+s*.75,x,y+s*.95);X.bezierCurveTo(x+s*.1,y+s*.75,x+s*.5,y+s*.62,x+s*.5,y+s*.32);X.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);fs(col,2.5);}

function spawnPattern(){
  const lvl=G.level,th=THEMES[G.theme],sp=Math.max(G.speed,290);
  const smallG=th.g.filter(k=>OBS[k][0]<=56&&OBS[k][1]<=44);
  const opts=['g','g','a'];if(lvl>=1)opts.push('gg','a');if(lvl>=2)opts.push('ga','ag');if(lvl>=3)opts.push('gGg','ga','aa');if(lvl>=4)opts.push('gg','gag','ag');
  const pat=pick(opts);let x=G.nextSpawn,last=null;
  const add=(k,xx)=>{const d=OBS[k],o={k,x:xx,w:d[0],h:d[1],t:d[2]?'a':'g',hang:d[2]==='hang',fly:d[2]==='fly',bot:d[2]?HB(SEL).ab:0,hit:false,passed:false,ph:rand(0,TAU),tum:0,col:pick(['#7950f2','#f06595','#20c997'])};o.end=xx+o.w;G.obs.push(o);last=o;return o;};
  const G1=()=>pick(th.g.filter(k=>k!=='trike'||pat==='g')),A1=()=>pick(th.a);
  if(pat==='g')add(G1(),x);
  else if(pat==='a')add(A1(),x);
  else if(pat==='gg'){if(smallG.length<1){add(G1(),x);}else{const a=add(pick(smallG),x);const k2=pick(smallG);const gap=rand(6,24);if(a.w+gap+OBS[k2][0]<=118)add(k2,a.end+gap);}}
  else if(pat==='ga'){const a=add(G1(),x);add(A1(),a.end+sp*rand(.95,1.15));}
  else if(pat==='ag'){const a=add(A1(),x);add(G1(),a.end+sp*rand(.62,.8));}
  else if(pat==='aa'){const a=add(A1(),x);add(A1(),a.end+sp*rand(.3,.45));}
  else if(pat==='gGg'){const a=add(G1(),x);add(G1(),a.end+sp*rand(.8,.95));}
  else if(pat==='gag'){const a=add(G1(),x);const b=add(A1(),a.end+sp*rand(.95,1.1));add(G1(),b.end+sp*rand(.65,.8));}
  const minT=Math.max(.9,(1.45-lvl*.11)*.9),maxT=minT+Math.max(.5,1-lvl*.08);
  const gap=sp*rand(minT,maxT);
  if(Math.random()<.24&&x-G.lastPowX>1700){let ks=['sneak','shield','juice','blank'];if(G.pw.shield)ks=ks.filter(k=>k!=='shield');G.pows.push({k:pick(ks),x:last.end+gap*.5,h:Math.random()<.5?72:150,got:false});G.lastPowX=x;}
  G.nextSpawn=last.end+gap;
}

function avoidedOne(){G.avoided++;G.combo++;G.bonus+=10;if(G.combo%5===0){const b=25*G.combo/5;G.bonus+=b;floatText(G.combo+' IN A ROW! +'+b,playerX(),GY-200,'#69db7c',22);sfx('combo');}}
function collect(u){

// ================= UPDATE =================
function update(dt){
  musicTick();
  if(state==='play')updPlay(dt);
  else if(state==='caught')updCaught(dt);
  else if(state==='menu'){selT+=dt;menuBubble.t-=dt;if(menuBubble.t<-4){menuBubble={t:2.2,txt:pick(PHRASES)};}}
  if(state!=='pause'&&!(state==='settings'&&settingsFrom==='pause'))updParts(dt,state==='play'||state==='caught'?G.speed*dt:0);
}
function updParts(dt,dx){
  for(const p of PARTS){if(p.world)p.x-=dx;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt;if(p.type==='feather'){p.vx*=.97;p.x+=Math.sin(p.life*6)*.6;}}
  PARTS=PARTS.filter(p=>p.life>0);
  for(const t of TEXTS){t.y-=40*dt;t.life-=dt;}TEXTS=TEXTS.filter(t=>t.life>0);
}
function updPlay(dt){
  const pl=G.pl,d=G.dad,pw=G.pw;
  if(G.banner.t>0)G.banner.t-=dt;
  G.themeFade=Math.min(1,G.themeFade+dt*.7);
  G.shake=Math.max(0,G.shake-dt);
  d.phraseT=Math.max(0,d.phraseT-dt);
  if(G.intro>0){G.intro-=dt;return;}
  G.time+=dt;
  const lvl=G.level;
  const base=(290+Math.min(lvl,4)*28+Math.max(0,lvl-4)*12)*1.1;
  let mul=1;if(pw.sneak>0)mul*=1.15;if(pw.juice>0)mul*=1.08;if(pl.stumble>0)mul*=.6;
  G.speed=lerp(G.speed,base*mul,1-Math.exp(-dt*4));
  const dx=G.speed*dt;G.cam+=dx;G.dist+=dx;
  const nl=Math.floor(G.dist/PXM/LEVEL_M);if(nl>G.level)levelUp(nl);
  // player
  pl.buffer=Math.max(0,pl.buffer-dt);
  pl.coyote=pl.ground?.1:Math.max(0,pl.coyote-dt);
  if(pl.buffer>0&&pl.coyote>0&&pl.stumble<.4){pl.vy=JV;pl.ground=false;pl.coyote=0;pl.buffer=0;pl.jt=0;sfx('jump');}
  if(!pl.ground){pl.vy-=GRAV*(input.duck?2.3:1)*dt;pl.y+=pl.vy*dt;pl.jt+=dt;if(pl.y<=0){pl.y=0;pl.vy=0;pl.ground=true;sfx('land');for(let i=0;i<5;i++)addP({x:playerX()+rand(-15,15),y:GY,vx:rand(-60,60),vy:rand(-80,-20),g:200,life:.4,size:rand(4,7),col:'rgba(255,255,255,.7)',type:'puff'});}}
  pl.duck=input.duck&&pl.ground;
  if(pl.duck&&!pl.wasDuck)sfx('duck');pl.wasDuck=pl.duck;
  const cad=CH[SEL].cad;pl.ph+=dt*G.speed/290*11*cad;
  if(pl.ground&&!pl.duck){pl.stepPh+=dt*G.speed/290*11*cad;if(pl.stepPh>PI){pl.stepPh-=PI;sfx('step');}}
  pl.stumble=Math.max(0,pl.stumble-dt);pl.inv=Math.max(0,pl.inv-dt);pl.drink=Math.max(0,pl.drink-dt);pl.cheer=Math.max(0,pl.cheer-dt);pl.knock*=Math.exp(-dt*2.5);
  for(const k of ['sneak','juice','blank'])if(pw[k]>0){pw[k]=Math.max(0,pw[k]-dt);}
  if(pw.sneak>0&&Math.random()<.5)addP({x:playerX()-14,y:GY-pl.y-rand(0,10),vx:-rand(60,140),vy:-rand(0,30),g:0,life:.35,size:rand(3,6),col:'#ffd43b',type:'star',vr:5});
  // dad gap
  const close=(3.5+Math.min(lvl,4)*1.15+Math.max(0,lvl-4)*.4)*1.1;
  let gr=-close;if(pw.sneak>0)gr+=30;if(pw.juice>0)gr+=20;if(pw.blank>0)gr+=26;
  d.gap+=gr*dt;
  if(d.push!==0){const r=260*dt,s=clamp(d.push,-r,r);d.gap+=s;d.push-=s;}
  d.gap=clamp(d.gap,40,430);
  dadUpdate(dt);
  // spawn
  let guard=0;while(G.nextSpawn<G.cam+VW+160&&guard++<5)spawnPattern();
  // obstacles
  const px=playerX(),hw=14,hb=HB(SEL),top=pl.y+(pl.duck?hb.duck:hb.stand),bot=pl.y;
  for(const o of G.obs){
    if(o.fly&&!o.hit)o.x-=34*dt;
    if(o.tum>0)o.tum+=dt;
    const ox=o.x-G.cam;
    if(!o.hit&&!o.passed&&pl.inv<=0&&px+hw>ox+7&&px-hw<ox+o.w-7){
      let hit;if(o.t==='g')hit=bot<o.h-7;else hit=top>o.bot+7&&(o.hang||bot<o.bot+o.h-6);
      if(hit)hitObstacle(o);
    }
    if(!o.passed&&ox+o.w<px-hw){o.passed=true;if(!o.hit)avoidedOne();}
  }
  G.obs=G.obs.filter(o=>o.x-G.cam>-260);
  for(const u of G.pows){if(u.got)continue;const ux=u.x-G.cam;if(Math.abs(ux-px)<hw+20&&u.h-20<top&&u.h+20>bot)collect(u);}
  G.pows=G.pows.filter(u=>!u.got&&u.x-G.cam>-100);
  G.score=Math.floor(G.dist/PXM)+G.bonus;
}
function dadUpdate(dt){
  const d=G.dad,pw=G.pw;
  d.t+=dt;d.ph+=dt*11*(G.speed/290)*(pw.blank>0?.75:1);d.cool=Math.max(0,d.cool-dt);
  if(pw.blank>0)d.face='confused';else if(d.st==='dizzy')d.face='dizzy';else if(d.st==='spin'||d.st==='windup')d.face='furious';else d.face=d.gap>230?'determined':d.gap>150?'angry':'furious';
  d.nextPhrase-=dt;
  if(d.nextPhrase<=0&&d.st==='chase'){dadShout(pw.blank>0?pick(CONFUSED):pick(PHRASES));d.nextPhrase=d.gap<150?rand(2.2,3.5):d.gap<230?rand(4,6):rand(6,9);}
  if(d.st==='chase'){if(d.gap<120&&d.cool<=0&&pw.blank<=0){d.st='warn';d.t=0;sfx('warn');dadShout(pick(['TOWEL WHIP!','HERE I COME!','SPIN ATTACK!']));}}
  else if(d.st==='warn'){if(d.t>.75){d.st='windup';d.t=0;sfx('windup');}}
  else if(d.st==='windup'){if(d.t>.45){d.st='spin';d.t=0;d.struck=false;sfx('spin');}}
  else if(d.st==='spin'){if(!d.struck&&d.t>=.36){d.struck=true;strike();if(state!=='play')return;}if(d.t>.8){d.st=d.dz?'dizzy':'chase';d.t=0;d.cool=2.35;if(d.dz)sfx('boing');}}
  else if(d.st==='dizzy'){if(d.t>1.4){d.st='chase';d.t=0;}}
}
function updCaught(dt){
  G.caughtT+=dt;G.speed*=Math.exp(-dt*3.5);G.cam+=G.speed*dt;G.shake=Math.max(0,G.shake-dt);
  G.dad.gap=lerp(G.dad.gap,62,1-Math.exp(-dt*5));G.dad.phraseT=2;G.dad.phrase='GOTCHA!';
  if(G.caughtT>2.6){state='over';sfx('gameover');setTimeout(()=>{if(state==='over')setSong(0);},1800);}
}

      X.save();X.globalAlpha=.25;X.fillStyle='#fff8c4';X.beginPath();X.moveTo(x-30,0);X.lineTo(x+30,0);X.lineTo(x+w*.8,FY);X.lineTo(x-w*.8,FY);X.closePath();X.fill();X.restore();}
    X.fillStyle='rgba(0,0,0,.22)';ell(x,FY,w*.42,8);X.fill();
    X.save();X.globalAlpha=alpha;X.translate(x,FY+ty);
    if(rot){X.translate(0,-h/2);X.rotate(rot);X.translate(0,h/2);}
    X.scale(sx,sy);
    if(img&&img.complete&&img.width)X.drawImage(img,-w/2,-h,w,h);else drawPerson(id,0,0,{mode:'idle',t:T,k:1.3});
    X.restore();
    // name tag
    const tagY=FY-h-14+(sel?ty*.3+Math.sin(T*6)*3:0);
    if(id==='daddy'){rrp(x-52,FY+6,104,22,10);fs('#e03131',2.5);txt('THE CHASER',x,FY+17,12,'#fff',{stroke:false});}
    else{const tw2=CH[id].name.length*11+24;rrp(x-tw2/2,FY+6,tw2,24,11);fs(sel?CH[id].color:'rgba(255,255,255,.92)',2.5);txt(CH[id].name.toUpperCase(),x,FY+18,14,sel?'#fff':CH[id].color,{stroke:false});}
    if(sel){X.save();X.translate(x,tagY-6);star(0,0,13,6,5,T*2);fs('#ffd43b',2);X.restore();}
    MENU_HIT.push({id,x:x-Math.max(w,70)/2-6,y:FY-h-10,w:Math.max(w,70)+12,h:h+40});
  });
  if(menuBubble.t>0){const x=VW*MENU_X[0];speech(x+20,FY-Hd-4,menuBubble.txt);}
  // buttons
  if(!under){
    if(SEL)button(VW/2-140,FY+38,280,52,'START GAME','#40c057',()=>{newGame();},{pulse:1,size:26});
    else{const s=Math.sin(T*4)*6;txt('TAP A CHARACTER!',VW/2,FY+64+s*.3,22,'#fff',{lw:5});}
    BTNS.push({x:VW-66,y:8,w:58,h:58,cb:()=>{settingsFrom='menu';state='settings';}});
    circ(VW-37,37,24);fs('rgba(255,255,255,.92)',3);X.save();X.translate(VW-37,37);X.rotate(T*.5);star(0,0,14,10,8,0);fs('#868e96',2);circ(0,0,5);fs('#fff',2);X.restore();
    if(bests.all){rrp(10,VH-46,150,34,12);fs('rgba(255,255,255,.92)',2.5);txt('🏆 BEST '+bests.all.toLocaleString(),85,VH-28,14,'#ff7a00',{stroke:false});}
    if(VH>VW*1.15){txt('Tip: turn your phone sideways!',VW/2,FY+120,18,'#fff',{lw:4});}
  }
}
function selectChar(id){
  if(id==='daddy'){menuBump.daddy=.5;menuBubble={t:2.2,txt:'CLEAN YOUR ROOM!'};dadVoice('Clean your room!');sfx('boing');return;}
  if(SEL!==id){SEL=id;selT=0;sfx('select');kidVoice(CH[id].name+'!',id);}else{menuBump[id]=.5;sfx('boing');}
}

// ================= INPUT =================
function toView(e){return[e.clientX/SC,e.clientY/SC];}
function hitBtn(x,y){for(let i=BTNS.length-1;i>=0;i--){const b=BTNS[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sfx('click');b.cb();return true;}}return false;}
function updDuck(){let d=input.keyDuck;for(const v of input.ptrs.values())if(v==='duck')d=true;input.duck=d;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const [x,y]=toView(e);
  if(state==='play'){
    if(hitBtn(x,y))return;
    if(G.intro>0)return;
    if(x<VW/2){input.ptrs.set(e.pointerId,'duck');}else{input.ptrs.set(e.pointerId,'jump');G.pl.buffer=.15;}
    updDuck();return;
  }
  if(hitBtn(x,y))return;
  if(state==='menu'){for(let i=MENU_HIT.length-1;i>=0;i--){const h=MENU_HIT[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){selectChar(h.id);return;}}}
},{passive:false});
const ptrEnd=e=>{input.ptrs.delete(e.pointerId);updDuck();};
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);cv.addEventListener('pointerleave',ptrEnd);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  audioInit();const k=e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(state==='play'){
    if((k===' '||k==='ArrowUp'||k==='w'||k==='W')&&!e.repeat&&G.intro<=0)G.pl.buffer=.15;
    if(k==='ArrowDown'||k==='s'||k==='S'){input.keyDuck=true;updDuck();}
    if(k==='Escape'||k==='p'||k==='P'){state='pause';sfx('click');}
  }else if(state==='pause'){if(k==='Escape'||k==='p'||k==='P'||k===' '){state='play';sfx('click');}}
  else if(state==='settings'){if(k==='Escape')state=settingsFrom;}
  else if(state==='menu'){
    if(k==='ArrowRight'||k==='ArrowLeft'){const i=SEL?PLAYABLE.indexOf(SEL):-1;const n=k==='ArrowRight'?(i+1)%3:(i+2)%3;selectChar(PLAYABLE[i<0?0:n]);}
    if((k==='Enter'||k===' ')&&SEL&&!e.repeat)newGame();
    if(['1','2','3'].includes(k))selectChar(PLAYABLE[+k-1]);
  }else if(state==='over'){if((k==='Enter'||k===' ')&&!e.repeat)newGame();if(k==='Escape'){state='menu';setSong(0);}}
});
window.addEventListener('keyup',e=>{if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){input.keyDuck=false;updDuck();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')state='pause';if(AU.ctx)AU.ctx.suspend();}else if(AU.ctx)AU.ctx.resume();});

// ================= LOOP =================
setSong(0);
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;T+=dt;try{update(dt);render();}catch(err){console.error(err);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__G=G;window.__draw=drawPerson;window.__api={newGame,selectChar,get state(){return state;},set state(v){state=v;},levelUp,collect,strike,caught,G};
</script>
